# ==============================================================================
# STYLE RADAR - PIPELINE CI/CD QA
# Microservicio: CADCHE-Stores-Service (ms-tiendas :8140)
# Flujo Automatizado: Build -> Pruebas (JaCoCo) -> SonarQube -> Docker OCI -> Azure QA
# ==============================================================================

name: CI/CD QA - Tiendas

on:
  push:
    branches:
      - develop
      - main
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: styleradar-tiendas
  AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME_QA || 'styleradar-tiendas-qa' }}

jobs:
  test-and-quality:
    name: 1. Build, Tests, Cobertura y SonarQube Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo fuente (Full History)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Configurar Java 21 Temurin (LTS)
        uses: actions/setup-java@6a0805fcefea3d4657a47ac4c165951e33482018 # v4.2.2
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache de paquetes SonarQube
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache de dependencias Maven
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Compilar y ejecutar pruebas completas con JaCoCo (255 pruebas)
        run: mvn -B clean verify --no-transfer-progress

      - name: Analisis estatico con SpotBugs (0 advertencias toleradas)
        run: mvn -B com.github.spotbugs:spotbugs-maven-plugin:4.8.6.6:check "-Dspotbugs.excludeFilterFile=spotbugs-exclude.xml"

      - name: Analisis estatico SonarQube Cloud (Quality Gate A)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=StyleRadar1_CADCHE-Stores-Service

      - name: Publicar reporte de cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: coverage-report-qa
          path: target/site/jacoco/
          retention-days: 14

  build-and-push:
    name: 2. Build y Push Imagen OCI Docker Hub
    needs: test-and-quality
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout del codigo fuente
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extraer metadatos y tags para Docker
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=qa-
            type=raw,value=qa-latest

      - name: Compilar y publicar imagen OCI multi-stage
        uses: docker/build-push-action@b32b51a8eda65d6793cd0494a773d4f6bcef32dc # v6.11.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-qa:
    name: 3. Desplegar a Azure App Service QA
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: qa
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/swagger-ui/index.html

    steps:
      - name: Autenticacion en Microsoft Azure
        uses: azure/login@d19a4f1b3c068b799dff7574ac265b0144f415fe # v2.2.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configurar App Settings y Variables de Entorno en Azure QA
        uses: azure/cli@3c87847598b988e406a2c25e657114d760fd035c # v2.1.0
        with:
          inlineScript: |
            RG=$(az webapp list --query "[?name=='${{ env.AZURE_WEBAPP_NAME }}'].resourceGroup | [0]" -o tsv)
            if [ -z "$RG" ]; then
              RG="${{ secrets.AZURE_RESOURCE_GROUP || 'rg-styleradar-qa' }}"
            fi
            echo "Configurando App Service: ${{ env.AZURE_WEBAPP_NAME }} en Resource Group: $RG"
            az webapp config appsettings set \
              --name "${{ env.AZURE_WEBAPP_NAME }}" \
              --resource-group "$RG" \
              --output none \
              --settings \
                WEBSITES_PORT=8140 \
                PORT=8140 \
                SPRING_PROFILES_ACTIVE=qa \
                DB_URL="${{ secrets.DB_URL_QA }}" \
                DB_USERNAME="${{ secrets.DB_USERNAME_QA }}" \
                DB_PASSWORD="${{ secrets.DB_PASSWORD_QA }}" \
                AZURE_STORAGE_BLOB_ENDPOINT="${{ secrets.AZURE_STORAGE_BLOB_ENDPOINT_QA || 'https://styleradarblobqa.blob.core.windows.net' }}" \
                SWAGGER_SERVER_URL="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"

      - name: Desplegar Contenedor Docker en Azure Web App (QA)
        id: deploy
        uses: azure/webapps-deploy@145a0687697df1d8a28909569f6e5d86213041f9 # v3.0.0
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:qa-latest

      - name: Smoke Test - Verificacion Swagger OpenAPI en Vivo
        run: |
          URL="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/v3/api-docs"
          echo "Ejecutando Smoke Test contra: $URL"
          for i in $(seq 1 25); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)
            echo "Intento $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Swagger OpenAPI UI desplegado y respondiendo 200 OK en QA"
              exit 0
            fi
            sleep 15
          done
          echo "Advertencia: La API tardo en iniciar o no respondio HTTP 200 en $URL"
          exit 1
