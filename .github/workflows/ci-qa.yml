# ==============================================================================
# STYLE RADAR - PIPELINE CI/CD QA
# Microservicio: CADCHE-Stores-Service (ms-tiendas :8140)
# Flujo Automatizado: Build -> Pruebas (JaCoCo) -> SonarQube -> Docker OCI -> Azure QA
# ==============================================================================

name: CI/CD QA - Tiendas

on:
  push:
    branches:
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: styleradar-tiendas
  AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME_QA || 'styleradar-tiendas-qa' }}

jobs:
  test-and-quality:
    name: 1. Build, Tests, Cobertura y SonarQube Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo fuente (Full History)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Configurar Java 21 Temurin (LTS)
        uses: actions/setup-java@6a0805fcefea3d4657a47ac4c165951e33482018 # v4.2.2
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache de paquetes SonarQube
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache de dependencias Maven
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Compilar y ejecutar pruebas completas con JaCoCo
        run: mvn -B clean verify --no-transfer-progress

      - name: Guardar JAR validado para la imagen Docker
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ms-tiendas-jar
          path: target/ms-tiendas-*.jar
          if-no-files-found: error
          retention-days: 1

      - name: Analisis estatico con SpotBugs (0 advertencias toleradas)
        run: mvn -B com.github.spotbugs:spotbugs-maven-plugin:4.8.6.6:check "-Dspotbugs.excludeFilterFile=spotbugs-exclude.xml"

      - name: Analisis estatico SonarQube Cloud (Quality Gate A)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=StyleRadar1_CADCHE-Stores-Service -Dsonar.qualitygate.wait=true

      - name: Publicar reporte de cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: coverage-report-qa
          path: target/site/jacoco/
          retention-days: 14

  build-and-push:
    name: 2. Build y Push Imagen OCI Docker Hub
    needs: test-and-quality
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout del codigo fuente
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Descargar JAR validado
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ms-tiendas-jar
          path: target

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extraer metadatos y tags para Docker
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=qa-${{ github.sha }}
            type=raw,value=qa-latest

      - name: Compilar y publicar imagen OCI multi-stage
        uses: docker/build-push-action@b32b51a8eda65d6793cd0494a773d4f6bcef32dc # v6.11.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-qa:
    name: 3. Desplegar a Azure App Service QA
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: qa
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/swagger-ui/index.html

    steps:
      - name: Autenticacion en Microsoft Azure
        uses: azure/login@d19a4f1b3c068b799dff7574ac265b0144f415fe # v2.2.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configurar App Settings y Variables de Entorno en Azure QA
        uses: azure/cli@3c87847598b988e406a2c25e657114d760fd035c # v2.1.0
        with:
          inlineScript: |
            RG=$(az webapp list --query "[?name=='${{ env.AZURE_WEBAPP_NAME }}'].resourceGroup | [0]" -o tsv)
            if [ -z "$RG" ]; then
              RG="${{ secrets.AZURE_RESOURCE_GROUP || 'rg-styleradar-qa' }}"
            fi
            echo "Configurando App Service: ${{ env.AZURE_WEBAPP_NAME }} en Resource Group: $RG"
            az webapp config appsettings set \
              --name "${{ env.AZURE_WEBAPP_NAME }}" \
              --resource-group "$RG" \
              --output none \
              --settings \
                WEBSITES_PORT=8140 \
                PORT=8140 \
                SPRING_PROFILES_ACTIVE=qa \
                DB_URL="${{ secrets.DB_URL_QA }}" \
                DB_USERNAME="${{ secrets.DB_USERNAME_QA }}" \
                DB_PASSWORD="${{ secrets.DB_PASSWORD_QA }}" \
                RABBITMQ_HOST="${{ secrets.RABBITMQ_HOST || 'styleradar-rabbitmq-qa.northcentralus.cloudapp.azure.com' }}" \
                RABBITMQ_PORT="${{ secrets.RABBITMQ_PORT || '5671' }}" \
                RABBITMQ_USER="${{ secrets.RABBITMQ_USER }}" \
                RABBITMQ_PASSWORD="${{ secrets.RABBITMQ_PASSWORD }}" \
                AZURE_STORAGE_BLOB_ENDPOINT="${{ secrets.AZURE_STORAGE_BLOB_ENDPOINT_QA || 'https://styleradarblobqa.blob.core.windows.net' }}" \
                SWAGGER_SERVER_URL="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
            # CADCHE-117: cadena de conexión de Azure Blob Storage; sin ella las subidas responden 503.
            BLOB_CS="${{ secrets.AZURE_STORAGE_CONNECTION_STRING_QA }}"
            if [ -n "$BLOB_CS" ]; then
              az webapp config appsettings set --name "${{ env.AZURE_WEBAPP_NAME }}" --resource-group "$RG" \
                --output none --settings AZURE_STORAGE_CONNECTION_STRING="$BLOB_CS"
            elif [ -z "$(az webapp config appsettings list --name "${{ env.AZURE_WEBAPP_NAME }}" --resource-group "$RG" --query "[?name=='AZURE_STORAGE_CONNECTION_STRING'].name" -o tsv)" ]; then
              echo "::warning::Falta AZURE_STORAGE_CONNECTION_STRING. Configure el secreto AZURE_STORAGE_CONNECTION_STRING_QA; las subidas responderán 503."
            fi
            # Credencial Basic de ms-segunda-vida-donaciones para /api/v1/internal/**; sin ella esas rutas responden 503.
            INTERNAL_PASS="${{ secrets.DONACIONES_INTERNAL_PASSWORD_QA }}"
            if [ -n "$INTERNAL_PASS" ]; then
              az webapp config appsettings set --name "${{ env.AZURE_WEBAPP_NAME }}" --resource-group "$RG" \
                --output none --settings DONACIONES_INTERNAL_USERNAME=ms-donaciones DONACIONES_INTERNAL_PASSWORD="$INTERNAL_PASS"
            elif [ -z "$(az webapp config appsettings list --name "${{ env.AZURE_WEBAPP_NAME }}" --resource-group "$RG" --query "[?name=='DONACIONES_INTERNAL_PASSWORD'].name" -o tsv)" ]; then
              echo "::warning::Falta DONACIONES_INTERNAL_PASSWORD. Configure el secreto DONACIONES_INTERNAL_PASSWORD_QA; /api/v1/internal/** responderá 503."
            fi
            JWT_SECRET="${{ secrets.JWT_QA || secrets.JWT_SECRET_BASE64_QA || secrets.JWT_SECRET_QA }}"
            if [ -n "$JWT_SECRET" ]; then
              az webapp config appsettings set --name "${{ env.AZURE_WEBAPP_NAME }}" --resource-group "$RG" \
                --output none --settings JWT_SECRET_BASE64="$JWT_SECRET"
            elif [ -z "$(az webapp config appsettings list --name "${{ env.AZURE_WEBAPP_NAME }}" --resource-group "$RG" --query "[?name=='JWT_SECRET_BASE64'].name" -o tsv)" ]; then
              echo "::error::Falta JWT_SECRET_BASE64 (mismo secreto Base64 de ms-auth QA). Configure el secreto JWT_QA."
              exit 1
            fi
            az webapp config appsettings set --name "${{ env.AZURE_WEBAPP_NAME }}" --resource-group "$RG" \
              --output none --settings TRUST_GATEWAY_HEADERS="${{ vars.TRUST_GATEWAY_HEADERS_QA || 'false' }}"
            # Guarda los logs del contenedor para poder diagnosticar un arranque fallido.
            az webapp log config --name "${{ env.AZURE_WEBAPP_NAME }}" --resource-group "$RG" \
              --docker-container-logging filesystem --output none
            echo "RG=$RG" >> "$GITHUB_ENV"
            az webapp start --name "${{ env.AZURE_WEBAPP_NAME }}" --resource-group "$RG"

      - name: Desplegar Contenedor Docker en Azure Web App (QA)
        id: deploy
        uses: azure/webapps-deploy@145a0687697df1d8a28909569f6e5d86213041f9 # v3.0.0
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:qa-${{ github.sha }}

      - name: Smoke Test - Verificacion Swagger OpenAPI y Health en Vivo
        run: |
          API_URL="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/v3/api-docs"
          HEALTH_URL="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/actuator/health"
          echo "Ejecutando Smoke Test contra: $API_URL y $HEALTH_URL"
          # Espera a que App Service reemplace el contenedor anterior para no validar la versión vieja.
          sleep 90
          SEGUIDOS=0
          for i in $(seq 1 30); do
            STATUS_API=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL" || true)
            STATUS_HEALTH=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || true)
            echo "Intento $i: OpenAPI=$STATUS_API Health=$STATUS_HEALTH"
            if [ "$STATUS_API" = "200" ] && [ "$STATUS_HEALTH" = "200" ]; then
              SEGUIDOS=$((SEGUIDOS + 1))
            else
              SEGUIDOS=0
            fi
            if [ "$SEGUIDOS" -ge 3 ]; then
              echo "Microservicio QA desplegado y respondiendo 200 OK (OpenAPI y Actuator Health)"
              exit 0
            fi
            sleep 15
          done
          echo "Advertencia: La API tardo en iniciar o no respondio HTTP 200 (OpenAPI=$STATUS_API, Health=$STATUS_HEALTH)"
          exit 1

      - name: Diagnostico - Logs del contenedor si el arranque falla
        if: failure()
        uses: azure/cli@3c87847598b988e406a2c25e657114d760fd035c # v2.1.0
        with:
          inlineScript: |
            az webapp show --name "${{ env.AZURE_WEBAPP_NAME }}" --resource-group "${{ env.RG }}" \
              --query "{estado:state, plan:appServicePlanId, disponible:availabilityState}" -o json || true
            az webapp log download --name "${{ env.AZURE_WEBAPP_NAME }}" --resource-group "${{ env.RG }}" \
              --log-file /tmp/logs.zip || exit 0
            cd /tmp && unzip -oq logs.zip -d logs || exit 0
            for f in $(ls -t logs/LogFiles/*default_docker.log logs/LogFiles/*_docker.log 2>/dev/null | head -2); do
              echo "===== $f"
              tail -n 120 "$f"
            done
