spring:
  rabbitmq:
    listener:
      simple:
        # Sin broker en las pruebas: los consumidores se prueban invocándolos directamente.
        auto-startup: false
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html


styleradar:
  security:
    jwt:
      secret-base64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    trust-gateway-headers: true

azure:
  storage:
    # Sin Azure ni Azurite: archivos en memoria (CADCHE-117).
    memoria-permitida: true
