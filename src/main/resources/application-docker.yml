# ==============================================================================
# STYLE RADAR - CONFIGURACIÓN DOCKER CONTAINER
# Perfil: docker (Semana 10 · DOSW · ECI - Guía Turtwig S10)
# ==============================================================================

server:
  port: ${SERVER_PORT:8140}
  forward-headers-strategy: framework

spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:postgresql://${DB_HOST:tiendas-db}:${DB_PORT:5432}/${DB_NAME:styleradar_tiendas}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

azure:
  storage:
    blob-endpoint: ${AZURE_STORAGE_BLOB_ENDPOINT:https://styleradarblobqa.blob.core.windows.net}

swagger:
  server-url: ${SWAGGER_SERVER_URL:http://localhost:8140}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
