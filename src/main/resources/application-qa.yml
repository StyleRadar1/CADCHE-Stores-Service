server:
  port: ${SERVER_PORT:${PORT:8140}}
  forward-headers-strategy: framework

spring:
  config:
    activate:
      on-profile: qa

  datasource:
    url: ${DB_URL:jdbc:postgresql://styleradar-pg-qa.postgres.database.azure.com:5432/styleradar_tiendas?sslmode=require}
    username: ${DB_USERNAME:styleradaradmin}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    # PostgreSQL de Azure compartido entre microservicios: pool pequeño para no agotar las conexiones.
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:styleradar-rabbitmq-qa.northcentralus.cloudapp.azure.com}
    port: ${RABBITMQ_PORT:5671}
    username: ${RABBITMQ_USER:${RABBITMQ_USERNAME:}}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:true}
      verify-hostname: ${RABBITMQ_SSL_VERIFY_HOSTNAME:true}

azure:
  storage:
    # CADCHE-117: cadena de conexión de la cuenta de Storage (secreto). Sin ella las subidas responden 503.
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
    contenedores-publicos: ${AZURE_STORAGE_CONTENEDORES_PUBLICOS:tiendas,documentos-almacenes,documentos-fundaciones}

swagger:
  server-url: ${SWAGGER_SERVER_URL:https://styleradar-tiendas-qa.azurewebsites.net}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    rabbit:
      enabled: false

# JWT_SECRET_BASE64 es obligatorio (mismo valor que ms-auth en este ambiente); sin el, el servicio no arranca.
styleradar:
  security:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64}
    trust-gateway-headers: ${TRUST_GATEWAY_HEADERS:false}
