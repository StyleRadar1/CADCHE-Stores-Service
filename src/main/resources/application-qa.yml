server:
  port: ${SERVER_PORT:${PORT:8140}}
  forward-headers-strategy: framework

spring:
  config:
    activate:
      on-profile: qa

  datasource:
    url: ${DB_URL:jdbc:postgresql://styleradar-pg-qa.postgres.database.azure.com:5432/styleradar_tiendas?sslmode=require}
    username: ${DB_USERNAME:styleradaradmin}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

azure:
  storage:
    blob-endpoint: ${AZURE_STORAGE_BLOB_ENDPOINT:https://styleradarblobqa.blob.core.windows.net}

swagger:
  server-url: ${SWAGGER_SERVER_URL:https://styleradar-tiendas-qa.azurewebsites.net}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

