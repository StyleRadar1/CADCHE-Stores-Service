server:
  port: ${SERVER_PORT:${PORT:8140}}
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  application:
    name: ms-tiendas
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/styleradar_tiendas}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:${RABBITMQ_USERNAME:guest}}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        # Un evento que falla va a la DLQ de su cola en vez de reintentarse sin fin.
        default-requeue-rejected: false
        # Si la cola no existe o no se puede declarar, el consumidor reintenta sin tumbar el arranque.
        missing-queues-fatal: false

  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# Seguridad: el JWT lo emite ms-auth (HS256 con el mismo secreto Base64). Las cabeceras X-User-* solo se
# aceptan sin token cuando el servicio esta restringido a la red del API Gateway (contrato B-0.1 / B-0.3).
styleradar:
  security:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64:}
    trust-gateway-headers: ${TRUST_GATEWAY_HEADERS:false}
  # Credenciales Basic de servicio para /api/v1/internal/** (ms-segunda-vida-donaciones y ms-auth). Sin contraseñas → 503.
  internal:
    donaciones:
      username: ${DONACIONES_INTERNAL_USERNAME:ms-donaciones}
      password: ${DONACIONES_INTERNAL_PASSWORD:}
    auth:
      username: ${AUTH_INTERNAL_USERNAME:ms-auth}
      password: ${AUTH_INTERNAL_PASSWORD:}
