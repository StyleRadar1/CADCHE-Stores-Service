services:

  ms-tiendas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-tiendas
    ports:
      - "8140:8140"
    environment:
      DB_URL: jdbc:postgresql://tiendas-db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      tiendas-db:
        condition: service_healthy
    networks:
      - tiendas-network

  tiendas-db:
    image: postgres:15
    container_name: tiendas-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - tiendas-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tiendas-network

volumes:
  tiendas-data:

networks:
  tiendas-network:
    driver: bridge
